# --- Data generation: TagsProvider#tag(TagKey) (used by CBCModernWarfareTags) ---
#
# DISABLED — re-enable in Phase 2 together with CBCModernWarfareTags.
# Widening only the parent makes IntrinsicHolderTagsProvider#tag (which overrides
# it at a weaker access level) fail to compile:
#   "IntrinsicHolderTagsProvider.tag(TagKey) in IntrinsicHolderTagsProvider cannot
#    override tag(TagKey) in TagsProvider; attempting to assign weaker access privileges"
# To use it, BOTH classes have to be widened:
#   public net.minecraft.data.tags.TagsProvider tag(Lnet/minecraft/tags/TagKey;)Lnet/minecraft/data/tags/TagsProvider$TagAppender;
#   public net.minecraft.data.tags.IntrinsicHolderTagsProvider tag(Lnet/minecraft/tags/TagKey;)Lnet/minecraft/data/tags/TagsProvider$TagAppender;
