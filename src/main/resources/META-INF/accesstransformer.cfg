# CBC Modern Warfare — NeoForge Access Transformer
#
# Migrated from the 1.20.1 Architectury `cbcmodernwarfare.accesswidener`
# (accessWidener v2 / named).
#
# Syntax: <access> <fully.qualified.ClassName> [member [descriptor]]
#   public / protected / private  — widen a class or member
#   public-f                      — widen AND remove final
#   extendable                    — allow subclassing a final class
#
# Commented-out entries are kept as a migration checklist; they are re-enabled
# together with the code that needs them (Phase 2/3).

