plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Create, Flywheel, Ponder, Catnip
    maven { url = "https://maven.createmod.net" }
    // Registrate
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    // NeoForge
    maven { url = "https://maven.neoforged.net/releases/" }
    // JEI
    maven { url = "https://maven.blamejared.com" }
    // Create Big Cannons + Ritchie's Projectile Library (fallback if libs/ jars are absent)
    maven {
        url = "https://maven.realrobotix.me/createbigcannons"
        content { includeGroup("com.rbasamoyai") }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically,
    // but it is declared explicitly so the file can live outside the default path later.
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // run/ is the CLIENT game dir and is where mcpmod (a client-only test mod) is dropped
            // into run/mods/. mcpmod loads net.minecraft.client.gui.screens.Screen at construction
            // time, so a dedicated server sharing this directory dies with
            // "Attempted to load class Screen for invalid dist DEDICATED_SERVER". Each other run
            // therefore gets its own gameDirectory below.
            gameDirectory = project.file('run')
            // 自动进入世界：原版自带 --quickPlaySingleplayer <存档目录名>，
            // 跳过主菜单直接加载存档（等价于用户手点"单人游戏 -> 新的世界"）。
            // 存档名从 run/saves/ 下取第一个，或用 -PquickPlaySave=xxx 指定；
            // 传空串（-PquickPlaySave=）可关闭，回到手动进世界的旧行为。
            def quickPlaySave = project.findProperty('quickPlaySave')
            if (quickPlaySave == null) {
                def savesDir = project.file('run/saves')
                quickPlaySave = savesDir.isDirectory()
                        ? (savesDir.listFiles()?.findAll { it.isDirectory() }?.sort { it.name }?.first()?.name ?: '')
                        : ''
            }
            if (quickPlaySave) {
                programArgument '--quickPlaySingleplayer'
                programArgument quickPlaySave
            }
        }

        server {
            server()
            programArgument '--nogui'
            // 25565 常被本地客户端内置服占用（同机跑 client + server 时必撞）。
            // 固定用 25566，免得每次验收都要先手动腾端口。
            //
            // R6b 起支持覆盖：同机的**其他项目**也可能占着 25566
            // （实测 EasyController 的服务端就长期占着它）。那种情况下用
            //   gradlew runServer -PserverPort=25567
            // 避开即可，不要为了跑测试去杀别人的进程。
            def serverPort = (project.findProperty('serverPort') ?: '25566').toString()
            programArgument '--port'
            programArgument serverPort
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Separate dir: no mcpmod. Also avoids fighting the client over world/session.lock.
            gameDirectory = project.file('run-server')
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Third dir: a gameTestServer that shares a world with runServer hits DirectoryLock
            // and still reports BUILD SUCCESSFUL — a false green worth designing out.
            gameDirectory = project.file('run-gametest')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            gameDirectory = project.file('run-data')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ---------------------------------------------------------------------
    // Create ecosystem (NeoForge 1.21.1)
    // ---------------------------------------------------------------------
    // :slim strips Create's runtime-only deps (FTB, JourneyMap, Curios, ...).
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // ---------------------------------------------------------------------
    // Create Big Cannons + Ritchie's Projectile Library
    //
    // Both are consumed as plain jars from libs/ (copied from a real 1.21.1
    // NeoForge game install). NeoForge 1.21+ mods ship Mojang-mapped already,
    // so no remapping is needed and a file dependency is sufficient.
    //
    // If libs/ is missing them, fall back to rbasamoyai's maven.
    // ---------------------------------------------------------------------
    def cbcLocal = file("libs/${cbc_jar}")
    if (cbcLocal.exists()) {
        implementation files(cbcLocal)
    } else {
        implementation("com.rbasamoyai:createbigcannons:5.11.7+mc.${minecraft_version}") { transitive = false }
    }

    def rplLocal = file("libs/${rpl_jar}")
    if (rplLocal.exists()) {
        implementation files(rplLocal)
    } else {
        implementation("com.rbasamoyai:ritchiesprojectilelib:2.1.2+mc.${minecraft_version}-neoforge") { transitive = false }
    }

    // ---------------------------------------------------------------------
    // Sable（子维度/载具物理）—— CBC 的可选兼容目标
    //
    // CBC 的 mods.toml 把它声明成 type = "optional"、versionRange = "[2.0.0,)"，
    // 并自带一整套 compat/sable 门面（SableCompat / CBCSableConnectivityUtils ...）。
    // 我们跟着 CBC 做同一套兼容，所以编译期需要它的类型。
    //
    // compileOnly：只在编译期要类型，运行期由玩家自己装（和 CBC 的 optional 语义一致）。
    // 千万不要写成 implementation —— 那会把 Sable 变成硬依赖，没装 Sable 的玩家直接起不来。
    //
    // 所有对 Sable 的直接调用都必须包在 CBCModsNeoForge.SABLE.isLoaded() 守卫里
    // （CBC 自己的 AbstractCannonProjectile#onImpact 就是这么写的）。
    // ---------------------------------------------------------------------
    def sableLocal = file("libs/${sable_jar}")
    if (sableLocal.exists()) {
        compileOnly files(sableLocal)
    } else {
        compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    }

    // SableCompanion 接口在单独的 companion jar 里。
    // Sable.HELPER 的声明类型是 ActiveSableCompanion，它 implements SableCompanion，
    // 所以只要写了 Sable.HELPER.xxx(...)，编译期就必须能解析到那个父接口。
    def sableCompanionLocal = file("libs/${sable_companion_jar}")
    if (sableCompanionLocal.exists()) {
        compileOnly files(sableCompanionLocal)
    }

    // ---------------------------------------------------------------------
    // Development QOL
    // ---------------------------------------------------------------------
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
}

// Expands all declared ${} placeholders in src/main/templates into the build output.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
            cbc_version_range      : cbc_version_range,
            rpl_version_range      : rpl_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------
// Fail-closed guard for the server runs.
//
// `gradlew runServer` reports BUILD SUCCESSFUL even when the server dies during mod
// construction — the JVM exits, Gradle sees the process end, and exitCode 0 is not
// checked by ModDevGradle. A crash therefore looks exactly like a clean run.
// (Observed with mcpmod: "invalid dist DEDICATED_SERVER" -> FATAL -> BUILD SUCCESSFUL.)
//
// This task reads the run's log and fails the build if a fatal marker is present.
// Wire it after any server run you care about: `gradlew runServer serverAssertClean`.
// ---------------------------------------------------------------------------
tasks.register('serverAssertClean') {
    group = 'verification'
    description = 'Fails if run-server/logs/latest.log contains a fatal mod-loading marker.'
    // Resolve the path at configuration time through a Provider: calling Project#file(...)
    // inside doLast is rejected once the configuration cache is enabled.
    //
    // R6a 修正：这里必须声明成 Task 的 output/input 依赖，否则**配置缓存复用**时
    // 会拿着旧的路径快照，出现「日志明明存在却报 not found」的假失败
    // （实测：先删 latest.log 再跑，缓存命中 → 报 not found，实际服务端是好的）。
    def logPath = layout.projectDirectory.file('run-server/logs/latest.log')
    // 让 Gradle 在缓存命中前重算：把该文件登记为输入（不存在也算一种输入状态）。
    inputs.file(logPath).optional().withPropertyName('serverLog')
        .withPathSensitivity(PathSensitivity.NONE)
    doLast {
        def log = logPath.asFile
        if (!log.exists()) {
            throw new GradleException("serverAssertClean: ${log} not found — did runServer actually start?")
        }
        def text = log.getText('UTF-8')
        def fatal = ['Mod loading has failed', 'invalid dist DEDICATED_SERVER',
                     'Failed to start the minecraft server', 'ModLoadingCrashException']
                .findAll { text.contains(it) }
        if (fatal) {
            throw new GradleException("serverAssertClean: server log contains FATAL marker(s): ${fatal}")
        }
        def done = text.contains('Done (') && text.contains('For help, type "help"')
        if (!done) {
            throw new GradleException('serverAssertClean: no "Done (" line — server never finished starting')
        }
        // R5b 起：模组在 ServerStartedEvent 里跑一遍纯逻辑自检并写
        // [R5b-SELFTEST] PASS/FAIL 行。没有这一行说明自检根本没跑（被跳过/类没加载），
        // 也只写 FAIL 说明有断言没过 —— 两种情况都不能算绿。
        if (!text.contains('[R5b-SELFTEST]')) {
            throw new GradleException('serverAssertClean: no [R5b-SELFTEST] lines — the self-test never ran')
        }
        // 只把「真失败」的行算失败：统计行 PASS=6 FAIL=0 里也有 FAIL 字样，
        // 但它的形态是 "FAIL=0"；失败行则是 "FAIL:" 或 "FAIL —"。
        def failed = (text.readLines().findAll {
            it.contains('[R5b-SELFTEST]') && (it.contains('FAIL:') || it.contains('FAIL —'))
        })
        if (failed) {
            throw new GradleException("serverAssertClean: self-test reported failure:\n${failed.join('\n')}")
        }
        println 'serverAssertClean: OK (server reached "Done", no fatal markers, self-test PASS)'
    }
}
