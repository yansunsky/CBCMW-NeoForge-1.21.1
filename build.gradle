plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Create, Flywheel, Ponder, Catnip
    maven { url = "https://maven.createmod.net" }
    // Registrate
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    // NeoForge
    maven { url = "https://maven.neoforged.net/releases/" }
    // JEI
    maven { url = "https://maven.blamejared.com" }
    // Create Big Cannons + Ritchie's Projectile Library (fallback if libs/ jars are absent)
    maven {
        url = "https://maven.realrobotix.me/createbigcannons"
        content { includeGroup("com.rbasamoyai") }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically,
    // but it is declared explicitly so the file can live outside the default path later.
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ---------------------------------------------------------------------
    // Create ecosystem (NeoForge 1.21.1)
    // ---------------------------------------------------------------------
    // :slim strips Create's runtime-only deps (FTB, JourneyMap, Curios, ...).
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // ---------------------------------------------------------------------
    // Create Big Cannons + Ritchie's Projectile Library
    //
    // Both are consumed as plain jars from libs/ (copied from a real 1.21.1
    // NeoForge game install). NeoForge 1.21+ mods ship Mojang-mapped already,
    // so no remapping is needed and a file dependency is sufficient.
    //
    // If libs/ is missing them, fall back to rbasamoyai's maven.
    // ---------------------------------------------------------------------
    def cbcLocal = file("libs/${cbc_jar}")
    if (cbcLocal.exists()) {
        implementation files(cbcLocal)
    } else {
        implementation("com.rbasamoyai:createbigcannons:5.11.7+mc.${minecraft_version}") { transitive = false }
    }

    def rplLocal = file("libs/${rpl_jar}")
    if (rplLocal.exists()) {
        implementation files(rplLocal)
    } else {
        implementation("com.rbasamoyai:ritchiesprojectilelib:2.1.2+mc.${minecraft_version}-neoforge") { transitive = false }
    }

    // ---------------------------------------------------------------------
    // Development QOL
    // ---------------------------------------------------------------------
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
}

// Expands all declared ${} placeholders in src/main/templates into the build output.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
            cbc_version_range      : cbc_version_range,
            rpl_version_range      : rpl_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
