# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# Mappings
# ---------------------------------------------------------------------------
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# NeoForge must be >= 21.1.228 (required by createbigcannons 5.11.7)
neo_version=21.1.235
loader_version_range=[4,)

# ---------------------------------------------------------------------------
# Mod properties
# ---------------------------------------------------------------------------
mod_id=cbcmodernwarfare
mod_name=CBC Modern Warfare
mod_license=MIT and CC BY-NC-SA (see github for details)
mod_version=0.3.5
mod_group_id=riftyboi.cbcmodernwarfare
mod_authors=riftyboi
mod_description=Modern Warfare is upon us.\nAttributions:\nTextures by RiftyBoi, BedrockBetter, Brownboy. Original CBC Textures by rbasamoyai, Milkyfur, and LopyLuna

# ---------------------------------------------------------------------------
# Create ecosystem (NeoForge 1.21.1)
# ---------------------------------------------------------------------------
create_version=6.0.10-280
create_version_range=[6.0.7,6.1.0)
ponder_version=1.0.82+mc1.21.1
registrate_version=MC1.21-1.3.0+67
flywheel_version=1.0.6

# ---------------------------------------------------------------------------
# Create Big Cannons + Ritchie's Projectile Library
# These are provided as local jars in libs/ (copied from a real game install).
# ---------------------------------------------------------------------------
cbc_jar=createbigcannons-5.11.7+mc.1.21.1.jar
cbc_version_range=[5.11.7,)
rpl_jar=ritchiesprojectilelib-2.1.2-mc.1.21.1-neoforge.jar
rpl_version_range=[2.1.2,)

# Sable（子维度/载具物理）—— CBC 的可选兼容目标，见 CBC 的 mods.toml：
#   modId = "sable", type = "optional", versionRange = "[2.0.0,)"
# 我们跟着 CBC 走同一套兼容，所以也需要它。
# 注意：CBC 用的是 api(...)，因为它的 Sable 类要被附属模组调用；
# 我们只在自己代码里调 CBC 的 SableCompat 门面，不暴露给第三方，故用 compileOnly + runtimeOnly。
sable_jar=sable-neoforge-1.21.1-2.0.6.jar
# Sable 的 companion 接口 jar（dev.ryanhcode.sable.companion.SableCompanion）。
# Sable.HELPER 的声明类型 ActiveSableCompanion 实现了它，所以编译期需要这个 jar 才能解析方法。
sable_companion_jar=sable-companion-common-1.21.1-1.6.0.jar
sable_version_range=[2.0.0,)

# ---------------------------------------------------------------------------
# Optional compat / dev QoL
# ---------------------------------------------------------------------------
jei_version=19.27.0.340
